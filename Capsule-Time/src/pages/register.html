<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun | Micro-Time Capsule</title>
    <link rel="icon" href="../assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="../scripts/tailwind-config.js"></script>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-6 py-12">
    <div id="toast-container"></div>

    <main class="w-full max-w-md space-y-8">
      <header class="text-center space-y-2">
        <a href="./index.html" class="inline-flex items-center justify-center gap-3 text-lg font-semibold">
          <img src="../assets/favicon.svg" alt="Logo" class="w-10 h-10" />
          <span>Micro-Time Capsule</span>
        </a>
        <h1 class="text-3xl font-bold">Buat Akun Baru</h1>
        <p class="text-slate-300 text-sm">Daftar dan mulai simpan pesan untuk masa depan.</p>
      </header>

      <section class="bg-white/10 border border-white/10 rounded-3xl p-8 space-y-6 backdrop-blur">
        <form id="register-form" class="space-y-5">
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium">Email</label>
            <input id="email" name="email" type="email" required class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium">Kata Sandi</label>
            <input id="password" name="password" type="password" required minlength="6" class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div class="space-y-2">
            <label for="username" class="block text-sm font-medium">Nama Pengguna</label>
            <input id="username" name="username" type="text" required minlength="3" class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            <p class="text-xs text-slate-400">Nama pengguna akan tampil di kapsul publik.</p>
          </div>
          <button type="submit" class="btn-primary w-full" id="register-submit">Daftar</button>
        </form>
        <p class="text-center text-sm text-slate-300">
          Sudah punya akun? <a href="./dashboard.html" class="text-indigo-300 hover:underline">Masuk sekarang</a>
        </p>
      </section>
    </main>

    <script type="module" src="../scripts/register.js"></script>
  </body>
</html>
