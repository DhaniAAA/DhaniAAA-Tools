<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buat Kapsul | Micro-Time Capsule</title>
    <link rel="icon" href="../assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="../scripts/tailwind-config.js"></script>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100">
    <div id="toast-container"></div>

    <header class="border-b border-white/10 bg-slate-900/70 backdrop-blur">
      <div class="max-w-5xl mx-auto px-4 sm:px-5 py-3 sm:py-4 flex items-center justify-between">
        <a href="./dashboard.html" class="flex items-center gap-2 sm:gap-3 text-base sm:text-lg font-semibold">
          <img src="../assets/favicon.svg" alt="Logo" class="w-7 h-7 sm:w-8 sm:h-8" />
          <span class="hidden sm:inline">Micro-Time Capsule</span>
          <span class="sm:hidden">MTC</span>
        </a>
        <nav class="flex items-center gap-2 sm:gap-3 text-sm">
          <a href="./dashboard.html" class="btn-secondary px-3 py-2">Dashboard</a>
          <button type="button" id="logout-button" class="btn-secondary hidden px-3 py-2">Keluar</button>
        </nav>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-5 py-6 sm:py-10">
      <section class="bg-white/10 border border-white/10 rounded-2xl sm:rounded-3xl p-5 sm:p-8 space-y-6 sm:space-y-8 backdrop-blur">
        <header class="space-y-2">
          <h1 class="text-2xl sm:text-3xl font-bold">Kapsul Baru</h1>
          <p class="text-sm sm:text-base text-slate-300">Tulis pesan untuk masa depanmu. Kamu bisa menambahkan media hingga 5MB.</p>
        </header>

        <form id="capsule-form" class="space-y-5 sm:space-y-6">
          <div class="grid sm:grid-cols-2 gap-4 sm:gap-6">
            <label class="flex flex-col gap-2">
              <span class="text-sm font-medium">Judul Kapsul</span>
              <input type="text" name="title" id="title" placeholder="Kapsul Tanpa Judul" class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </label>
            <label class="flex flex-col gap-2">
              <span class="text-sm font-medium">Mode</span>
              <select name="mode" id="mode" class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="private">Private</option>
                <option value="shared">Shared (Link)</option>
                <option value="public">Public</option>
              </select>
            </label>
          </div>

          <label class="flex flex-col gap-2">
            <span class="text-sm font-medium">Pesan Teks</span>
            <textarea name="content" id="content" rows="6" placeholder="Tulis pesanmu untuk masa depan..." class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
          </label>

          <div class="grid sm:grid-cols-2 gap-4 sm:gap-6">
            <label class="flex flex-col gap-2">
              <span class="text-sm font-medium">Tanggal Buka</span>
              <input type="date" name="unlock_date" id="unlock_date" required class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </label>
            <label class="flex flex-col gap-2">
              <span class="text-sm font-medium">Waktu Buka</span>
              <input type="time" name="unlock_time" id="unlock_time" required class="w-full rounded-xl border border-white/20 bg-slate-900/60 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </label>
          </div>

          <label class="flex flex-col gap-2">
            <span class="text-sm font-medium">Media (opsional)</span>
            <input type="file" name="media" id="media" accept="image/*,audio/*" class="block w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-700" />
            <p class="text-xs text-slate-400">Format gambar atau audio. Maksimum 5MB.</p>
          </label>

          <div class="flex flex-col gap-2">
            <span class="text-sm font-medium">Pratinjau Countdown</span>
            <div id="countdown-preview" class="text-sm text-indigo-200"></div>
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
            <button type="submit" class="btn-primary w-full sm:w-auto" id="submit-button">Simpan Kapsul</button>
            <a href="./dashboard.html" class="btn-secondary w-full sm:w-auto text-center">Batal</a>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="../scripts/create.js"></script>
  </body>
</html>
