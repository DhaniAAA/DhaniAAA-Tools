<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed Publik | Micro-Time Capsule</title>
    <link rel="icon" href="../assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="../scripts/tailwind-config.js"></script>
    <link rel="stylesheet" href="../styles/global.css" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="toast-container"></div>

    <header class="border-b border-white/10 bg-slate-900/70 backdrop-blur">
      <div class="max-w-6xl mx-auto px-4 sm:px-5 py-3 sm:py-4 flex items-center justify-between">
        <a href="./index.html" class="flex items-center gap-2 sm:gap-3 text-base sm:text-lg font-semibold">
          <img src="../assets/favicon.svg" alt="Logo" class="w-8 h-8 sm:w-9 sm:h-9" />
          <span class="hidden sm:inline">Micro-Time Capsule</span>
          <span class="sm:hidden">MTC</span>
        </a>
        <nav class="flex items-center gap-2 sm:gap-3 text-sm">
          <a href="./dashboard.html" class="btn-secondary px-3 py-2">Dashboard</a>
          <a href="./create.html" class="btn-secondary hidden sm:inline-flex px-3 py-2">Buat Kapsul</a>
        </nav>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-5 py-6 sm:py-10 space-y-8 sm:space-y-10">
      <section class="space-y-2 sm:space-y-3 text-center">
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold px-4">Kapsul Publik Terbaru</h1>
        <p class="text-sm sm:text-base text-slate-300 px-4">Kapsul yang sudah waktunya dibuka dari komunitas. Berikan reaksimu!</p>
      </section>

      <section id="public-feed" class="card-grid card-grid-sm-2 card-grid-lg-3"></section>

      <template id="skeleton-card-template">
        <article class="bg-white/10 border border-white/10 rounded-xl p-6 space-y-4 animate-pulse">
          <div class="h-8 bg-white/10 rounded"></div>
          <div class="h-24 bg-white/10 rounded"></div>
          <div class="h-6 bg-white/10 rounded"></div>
        </article>
      </template>
    </main>

    <script type="module" src="../scripts/public-feed.js"></script>
  </body>
</html>
